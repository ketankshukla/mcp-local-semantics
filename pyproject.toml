[project]
name = "mcp-local-semantics"
version = "0.1.0"
description = "An MCP server exposing local embedding tools, so an agent stops paying an API round trip per call"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "mcp>=2.0", "sentence-transformers>=3.0", "torch>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
