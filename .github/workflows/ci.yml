name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only the dependencies the suite needs. torch and sentence-transformers
      # are runtime requirements for the dense retriever and the reranker; the
      # tests deliberately cover the parts that do not need a model download,
      # so CI stays fast and does not depend on a model host being reachable.
      - run: pip install numpy pytest
      - run: pytest -q
